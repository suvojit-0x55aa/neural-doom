name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64

      - name: Build NeuralDoom
        run: >-
          xcodebuild
          -project NeuralDoom.xcodeproj
          -scheme NeuralDoom
          -configuration Debug
          -derivedDataPath DerivedData
          -destination 'platform=macOS,arch=arm64'
          build
          CODE_SIGNING_ALLOWED=NO

      - name: Build CircuitTests
        run: >-
          xcodebuild
          -project NeuralDoom.xcodeproj
          -scheme CircuitTests
          -configuration Debug
          -derivedDataPath DerivedData
          -destination 'platform=macOS,arch=arm64'
          build
          CODE_SIGNING_ALLOWED=NO

      - name: Run circuit, contract, and WAD tests
        run: DerivedData/Build/Products/Debug/CircuitTests --quick

      - name: Verify data-directory compatibility
        run: DerivedData/Build/Products/Debug/CircuitTests --data-directory-compatibility

      - name: Verify clean app bundle
        run: >-
          DerivedData/Build/Products/Debug/CircuitTests
          --app-bundle
          "$PWD/DerivedData/Build/Products/Debug/NeuralDoom.app"
